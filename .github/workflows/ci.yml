name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install just
        run: cargo install just --version 1.58.0 --locked
      - name: Check public dependency boundary
        run: just check-public-deps
      - run: just check
      - run: git diff --exit-code -- internal/store/sqlitegen web/src/api
      - run: go run ./tools/loadgen -jobs 5 -duration 2s
      - run: go run ./tools/loadgen -jobs 5 -duration 2s -janitor -prefill 100
      - run: ./tools/litestream-restore-test.sh
      - run: just test-integration
      - run: just e2e # browser smoke, axe and Lighthouse against ./bin/cronpad (runner has Google Chrome)
