version: 2
project_name: cronpad
before:
  hooks:
    - just build-web
builds:
  - id: cronpad
    main: ./cmd/cronpad
    binary: cronpad
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/gowthamgts/cronpad/internal/version.Version={{.Version}} -X github.com/gowthamgts/cronpad/internal/version.Commit={{.Commit}} -X github.com/gowthamgts/cronpad/internal/version.BuildDate={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, README.md, config.example.toml, web/packages/design/fonts/OFL.txt]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
    cmd: go
    args: ['tool', '-modfile={{ .Env.PWD }}/tools/sbom/go.mod', 'syft', '${artifact}', '--output', 'spdx-json=${document}']
    documents:
      - '${artifact}.sbom.spdx.json'
release:
  prerelease: auto
changelog:
  sort: asc
