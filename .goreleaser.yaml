version: 2
project_name: cronpad
before:
  hooks:
    - just build-web
builds:
  - id: cronpad
    main: ./cmd/cronpad
    binary: cronpad
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/gowthamgts/cronpad/internal/version.Version={{.Version}} -X github.com/gowthamgts/cronpad/internal/version.Commit={{.Commit}} -X github.com/gowthamgts/cronpad/internal/version.BuildDate={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, README.md, config.example.toml, web/packages/design/fonts/OFL.txt]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
    cmd: go
    args: ['tool', '-modfile={{ .Env.PWD }}/tools/sbom/go.mod', 'syft', '${artifact}', '--output', 'spdx-json=${document}']
    documents:
      - '${artifact}.sbom.spdx.json'
release:
  prerelease: auto
# Commit subjects start with a lowercase verb, so groups key on the first word; the first matching group wins.
changelog:
  sort: asc
  filters:
    exclude: ['^Merge pull request', '^merge ']
  groups:
    - title: Features
      regexp: '^(add|expose|support|allow|introduce|enable)\b'
      order: 0
    - title: Fixes
      regexp: '^fix\b'
      order: 1
    - title: Performance
      regexp: '^(speed up|reduce|cache)\b'
      order: 2
    - title: Dependencies
      regexp: '^(bump|upgrade|update \S+ to)\b'
      order: 3
    - title: Other changes
      order: 999
