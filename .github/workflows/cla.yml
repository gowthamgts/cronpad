# SECURITY: never check out, build, or run PR code. Read PR metadata only via API.
name: Contributor license agreement
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: read
  issues: write
  statuses: write
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
env:
  CLA_VERSION: '1.2'
  # Comma-separated GitHub logins exempt from the CLA check (project maintainers).
  CLA_MAINTAINERS: 'gowthamgts'
jobs:
  cla:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
       contains(github.event.comment.body, 'recheck')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // Load only trusted code from the repository default branch, never PR HEAD.
            const ref = context.payload.repository.default_branch;
            const {data} = await github.rest.repos.getContent({...context.repo, ref, path: '.github/scripts/cla.cjs'});
            const filename = require('path').join(process.env.RUNNER_TEMP, 'cronpad-cla.cjs');
            require('fs').writeFileSync(filename, Buffer.from(data.content, 'base64'));
            await require(filename).run({github, context, version: process.env.CLA_VERSION, maintainers: process.env.CLA_MAINTAINERS});
