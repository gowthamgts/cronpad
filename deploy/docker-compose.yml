services:
  cronpad:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports: ['8080:8080']
    environment:
      # Optional host inputs for the local quickstart; otherwise use app defaults.
      CRONPAD_AUTH__DEV_LOGIN:
      CRONPAD_SECRETS__ENCRYPTION_KEY:
      CRONPAD_TELEMETRY__OTLP_ENDPOINT: http://otel-collector:4317
      CRONPAD_TELEMETRY__OTLP_LOGS: "true"
      # Command sinks are off by default; set CRONPAD_SINKS__COMMAND__ENABLED=true to allow them.
      CRONPAD_SINKS__COMMAND__ENABLED: ${CRONPAD_SINKS__COMMAND__ENABLED:-false}
      # Optional: allow another site (e.g. one embedding the schedule preview) to call /api/ from the browser.
      # No cookies are ever sent cross-origin. Comma-separated exact origins.
      # CRONPAD_UI__CORS_ORIGINS: https://www.example.com
    volumes: [cronpad-data:/data]
    stop_grace_period: 40s
    depends_on: [otel-collector]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    volumes: ['./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro']
    ports: ['127.0.0.1:4317:4317', '127.0.0.1:4318:4318']
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml:ro', './prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:11.6.0
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/cronpad-dashboard.json:/var/lib/grafana/dashboards/cronpad.json:ro
volumes:
  cronpad-data:
