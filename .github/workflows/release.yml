name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      # Same toolchain as CI, including the prebuilt just (compiling it took ~2 minutes).
      - uses: ./.github/actions/setup
        with: {go: 'true', node: 'true'}
      - run: just release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up buildx and QEMU
        run: |
          docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64
          docker buildx create --use
      - name: Login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The build stages cross-compile natively (see deploy/Dockerfile); QEMU only runs the
      # arm64 runtime stage's apk/adduser. Layers are cached in ghcr under :buildcache, so
      # unchanged dependency installs are reused; a failed cache export doesn't fail the release.
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          tags="-t $image:$version"
          case "$version" in
            *-*) ;; # pre-release: only the exact version tag
            *) tags="$tags -t $image:${version%%.*} -t $image:latest" ;;
          esac
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f deploy/Dockerfile $tags \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max,ignore-error=true" \
            --provenance=true --sbom=true --push .
