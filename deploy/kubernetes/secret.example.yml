# Replace every placeholder before applying; keep real credentials out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: cronpad-env
type: Opaque
stringData:
  CRONPAD_SERVER__PUBLIC_URL: https://cron.example.com
  CRONPAD_AUTH__GITHUB__CLIENT_ID: REPLACE_ME
  CRONPAD_AUTH__GITHUB__CLIENT_SECRET: REPLACE_ME
  CRONPAD_SECRETS__ENCRYPTION_KEY: REPLACE_WITH_BASE64_32_RANDOM_BYTES
  # Optional: allow another site (e.g. one embedding the schedule preview) to call /api/ from the browser.
  # No cookies are ever sent cross-origin.
  # CRONPAD_UI__CORS_ORIGINS: https://www.example.com
  LITESTREAM_REPLICA_URL: s3://REPLACE_BUCKET/cronpad
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
