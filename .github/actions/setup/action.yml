name: Set up toolchain
description: just, plus Go and/or Node with caches. Pair with the "Save Go cache" step at the end of a job.
inputs:
  go:
    description: Set up Go and restore its build, module and golangci-lint caches.
    default: 'false'
  node:
    description: Set up Node and pnpm with the pnpm store cache.
    default: 'false'
outputs:
  go-cache-key:
    description: Key for actions/cache/save; empty when the exact key was already restored.
    value: ${{ steps.go-cache.outputs.cache-hit != 'true' && steps.go-cache.outputs.cache-primary-key || '' }}
runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        # setup-go only saves its cache when the whole job succeeds, and one shared key
        # would be won by whichever job finishes first. Cache per job below instead.
        cache: false
    - if: inputs.go == 'true'
      id: go-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
        # Include the separately pinned tool modules, not just the application module.
        key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.sum') }}
        restore-keys: go-${{ runner.os }}-${{ github.job }}-
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        version: 12.8.1
    - if: inputs.node == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 26
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install just
      shell: bash
      # Avoid compiling Rust on every run; pin both the version and archive digest.
      run: |
        archive="$RUNNER_TEMP/just.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz \
          --output "$archive"
        echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/just-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/just-bin" just
        echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
