# Standalone local backup demo; run with --env-file deploy/demo.env.
# These fixed credentials are for local use only, not production.
services:
  cronpad:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports: ['8080:8080']
    environment:
      CRONPAD_AUTH__DEV_LOGIN: ${CRONPAD_AUTH__DEV_LOGIN:-false}
      CRONPAD_SECRETS__ENCRYPTION_KEY: ${CRONPAD_SECRETS__ENCRYPTION_KEY:-}
      CRONPAD_DATABASE__PATH: /data/cronpad.db
      CRONPAD_DATABASE__HISTORY_PATH: /data/history.db
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes: [cronpad-data:/data]
    stop_grace_period: 40s
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # Single-process master + volume + filer + S3 gateway on :8333. Demo only.
    command: ['server', '-dir=/data', '-s3', '-s3.config=/etc/seaweedfs/s3.json']
    ports: ['127.0.0.1:8333:8333']
    volumes: ['seaweedfs-data:/data', './seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro']
  seaweedfs-init:
    image: amazon/aws-cli:2.38.1
    depends_on: [seaweedfs]
    environment:
      AWS_ACCESS_KEY_ID: cronpad-demo
      AWS_SECRET_ACCESS_KEY: cronpad-demo-local-only
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket cronpad-demo ||
        aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket cronpad-demo; do sleep 2; done
volumes:
  cronpad-data:
  seaweedfs-data:
