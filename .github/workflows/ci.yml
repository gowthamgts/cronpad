name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer commit makes an older run for the same PR/branch redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Independent jobs so the slow parts run side by side; together they cover `just check`
# plus the integration, load, restore and browser checks.
# Each Go job keeps its own cache (see .github/actions/setup). The save step runs even
# when tests fail, so a red run still warms the next one. Its path list must match the
# restore step exactly.
jobs:
  # Decides which jobs below are worth running. Skipped jobs count as passing for
  # required checks, so docs-only and web-only PRs stay mergeable. Pushes to main
  # (and CI/tooling changes) always run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'code=true\ngo=true\nweb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          code=false go=false web=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci.yml|.github/actions/*|justfile) code=true go=true web=true ;;
              *.md|LICENSE|skills/*|.github/scripts/*|.github/workflows/cla.yml|.github/workflows/release.yml) ;;
              api/openapi.yaml|pnpm-*|package.json) code=true go=true web=true ;;
              web/*) code=true web=true ;;
              '') ;;
              *) code=true go=true ;;
            esac
          done <<< "$files"
          printf 'code=%s\ngo=%s\nweb=%s\n' "$code" "$go" "$web" >> "$GITHUB_OUTPUT"

  generated:
    name: Generated code and dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: setup
        uses: ./.github/actions/setup
        with: {go: 'true', node: 'true'}
      - name: Check public dependency boundary
        run: just check-public-deps
      - run: just check-generated
      - run: git diff --exit-code -- internal/store/sqlitegen web/src/api
      - run: just lint-sql
      - name: Save Go cache
        if: ${{ !cancelled() && steps.setup.outputs.go-cache-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.setup.outputs.go-cache-key }}

  lint-go:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: setup
        uses: ./.github/actions/setup
        with: {go: 'true'}
      - run: just lint-go
      - name: Save Go cache
        if: ${{ !cancelled() && steps.setup.outputs.go-cache-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.setup.outputs.go-cache-key }}

  web:
    name: Web lint and tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with: {node: 'true'}
      - run: just lint-web
      - run: just test-web

  test-go:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: setup
        uses: ./.github/actions/setup
        with: {go: 'true'}
      # web/dist/.gitkeep keeps the embed compiling without a frontend build.
      - run: just test-go
      - name: Save Go cache
        if: ${{ !cancelled() && steps.setup.outputs.go-cache-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.setup.outputs.go-cache-key }}

  integration:
    name: Integration, load and restore
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: setup
        uses: ./.github/actions/setup
        with: {go: 'true'}
      - run: go run ./tools/loadgen -jobs 5 -duration 2s
      - run: go run ./tools/loadgen -jobs 5 -duration 2s -janitor -prefill 100
      - run: ./tools/litestream-restore-test.sh
      - run: just test-integration
      - name: Save Go cache
        if: ${{ !cancelled() && steps.setup.outputs.go-cache-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.setup.outputs.go-cache-key }}

  browser:
    name: Build, browser smoke and Lighthouse
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: setup
        uses: ./.github/actions/setup
        with: {go: 'true', node: 'true'}
      # Builds web/dist, ./bin/cronpad and the example, and checks version injection.
      # e2e and Lighthouse then test that exact binary.
      - run: just check-version
      # The runner has Google Chrome for browser smoke, axe and Lighthouse.
      - name: Browser smoke and accessibility
        run: pnpm --dir web e2e
      - name: Lighthouse
        run: pnpm --dir web lighthouse
      - name: Save Go cache
        if: ${{ !cancelled() && steps.setup.outputs.go-cache-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.setup.outputs.go-cache-key }}
